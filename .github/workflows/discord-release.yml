name: Discord release announcement

# Keeps exactly one release card per Discord releases channel: when a release is
# published (stable or pre-release), posts the card for it (the app's icon, its
# What's New, Download and the release's hero picture), deletes the previous
# card, and stores the new Discord message id as a workflow artifact for the
# next run. Run manually with dry_run=true to preview the payload built from the
# latest release, or dry_run=false to perform the same replace.
# Exo Launcher, Exo Cinema and Exo Browser run this same file: only PRODUCT and
# APP below differ.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the payload from the latest release and print it instead of posting
        type: boolean
        default: true
      ping:
        description: Mention the release role (a published release always does)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: discord-release-card
  cancel-in-progress: false

env:
  PRODUCT: "Exo Browser"
  # getexo.app/<APP> and .github/discord/exo-<APP>-avatar.png
  APP: browser
  ASSET_DIR: .github/discord
  STATE_ARTIFACT: discord-last-release-message

jobs:
  announce:
    name: Announce release on Discord
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release.json"
          if [[ "$EVENT_NAME" == "release" ]]; then
            jq '.release' "$GITHUB_EVENT_PATH" > "$out"
          else
            api() {
              curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -w '\n%{http_code}' "$API_URL/repos/$REPO/$1"
            }
            resp="$(api releases/latest)"
            code="${resp##*$'\n'}"
            if [[ "$code" == "200" ]]; then
              printf '%s' "${resp%$'\n'*}" > "$out"
            else
              echo "No latest stable release (HTTP $code); falling back to the most recent release incl. pre-releases."
              resp="$(api 'releases?per_page=20')"
              code="${resp##*$'\n'}"
              if [[ "$code" != "200" ]]; then
                echo "::error::Failed to list releases (HTTP $code)."
                exit 1
              fi
              printf '%s' "${resp%$'\n'*}" | jq 'map(select(.draft | not)) | first // empty' > "$out"
            fi
          fi
          if ! jq -e 'type == "object" and has("tag_name")' "$out" > /dev/null; then
            echo "::error::Could not resolve a published release for $REPO."
            exit 1
          fi
          jq -r '"Release: \(.tag_name) (prerelease=\(.prerelease)) \(.html_url)"' "$out"

      - name: Build payload
        env:
          ROLE_ID: ${{ (github.event_name == 'release' || inputs.ping) && vars.DISCORD_RELEASE_ROLE_ID || '' }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/payload.json" <<'PY'
          import json, os, re, sys, urllib.request

          r = json.load(open(sys.argv[1], encoding="utf-8"))
          product, app, repo = os.environ["PRODUCT"], os.environ["APP"], os.environ["GITHUB_REPOSITORY"]
          tag, page, body = r["tag_name"], r["html_url"], (r.get("body") or "").replace("\r\n", "\n")
          version, pre = tag.removeprefix("v"), r.get("prerelease") is True
          raw, site = f"https://raw.githubusercontent.com/{repo}", "https://getexo.app"
          IMAGE = r"\.(?:jpe?g|png|webp|gif)(?:\?[^\s)\"]*)?"

          def warn(text):
              print(f"::warning::{text}")

          def fetch(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={"User-Agent": "exo-release-card"})
              with urllib.request.urlopen(req, timeout=20) as res:
                  return res.headers.get("Content-Type", ""), res.read()

          def image(url):
              """The URL when it answers as a picture; Discord draws a broken one (or the default avatar) otherwise."""
              try:
                  kind = fetch(url, "HEAD")[0]
              except Exception as e:
                  return warn(f"{url} did not load ({e}).")
              return url if kind.startswith("image/") else warn(f"{url} is {kind or 'not a picture'}.")

          def md(text):
              """One line of plain words, safe from Discord markdown."""
              text = re.sub(r"([\\*_~`|\[\]])", r"\\\1", " ".join(str(text).split()))
              return re.sub(r"^([#>-]|\d+\.)", r"\\\1", text)

          def asset(test):
              return next((a for a in r.get("assets") or [] if test(a.get("name", "").lower())), None)

          # What's New: the items the app shows for this version (Build-Release's whats-new.json), a few at most.
          items = []
          if wn := asset(lambda n: n == "whats-new.json"):
              try:
                  data = json.loads(fetch(wn["browser_download_url"])[1])
                  if str(data.get("version")) == version:
                      items = [i for i in data.get("items") or [] if isinstance(i, dict) and str(i.get("title") or "").strip()]
                  else:
                      warn(f"whats-new.json is for {data.get('version')}, not {version}.")
              except Exception as e:
                  warn(f"Could not read whats-new.json ({e}).")
          blocks = [f"**{md(i['title'])}**\n{md(i.get('detail') or '')}".strip() for i in items[:3]]
          if not blocks:  # else the release's opening paragraph
              intro = next((p.strip() for p in body.split("\n\n") if p.strip() and not re.match(r"\s*[#!<>|*_-]", p)), "")
              blocks = [" ".join(intro.split())[:1000] or f"A new version of {product} is out."]
          download = page if pre else f"{site}/{app}"
          links = [f"**[Download]({download})**"] + ([] if pre else [f"[All changes]({page})"]) + [f"[getexo.app]({site})"]

          # The hero: the release's first picture (its hero at the tag), else README's first picture at the tag.
          hero = None
          if m := re.search(r"!\[[^\]]*\]\((https://[^\s)]+?" + IMAGE + r")\)", body):
              hero = m.group(1)
          else:
              try:
                  readme = fetch(f"{raw}/{tag}/README.md")[1].decode("utf-8", "replace")
                  hero = next((f"{raw}/{tag}/{p.removeprefix('./')}" for p in re.findall(r"!\[[^\]]*\]\(([^\s)]+?" + IMAGE + r")\)", readme)
                               if not re.match(r"[a-z]+:|/", p) and "logo" not in p.rsplit("/", 1)[-1]), None)
              except Exception as e:
                  warn(f"Could not read README.md at {tag} ({e}).")
          hero = hero and image(hero)

          # Exo's own size format (formatSize in Exo Launcher's ui/src/lib/utils.ts).
          footer = ["Exo", "Windows 11"]
          if setup := asset(lambda n: n.endswith("-setup.exe")):
              n = setup["size"]
              footer.append(f"{n / 1024**3:.1f} GB" if n >= 1024**3 else f"{int(n / 1024**2 + 0.5)} MB")

          role = re.sub(r"\s", "", os.environ.get("ROLE_ID") or "")
          if role and not re.fullmatch(r"[0-9]{17,20}", role):
              warn("Variable DISCORD_RELEASE_ROLE_ID is not a Discord snowflake; posting without a role mention.")
              role = ""
          # ?v= busts Discord's image-proxy cache when the avatar file changes.
          avatar = f"{raw}/main/{os.environ['ASSET_DIR']}/exo-{app}-avatar.png?v={os.environ['GITHUB_SHA'][:12]}"
          image(avatar)
          # Exo's family mark (M3 Bracket) beside "Exo": the one in Exo Launcher's repo serves all three.
          mark = image("https://raw.githubusercontent.com/UhhErix/ExoLauncher/main/.github/discord/exo-logo-512.png")
          embed = {
              "color": 0x010101,  # Void black; Discord draws 0 as no color
              "title": f"{product} {version}" + (" (pre-release)" if pre else ""),
              "url": page,
              "description": "\n\n".join(blocks + [" · ".join(links)]),
              "footer": {"text": " · ".join(footer), **({"icon_url": mark} if mark else {})},
              "timestamp": r.get("published_at") or r.get("created_at"),
          }
          if hero:
              embed["image"] = {"url": hero}
          # Discord blocks phantom pings: <@&id> has to be in content on POST
          # (flags 4096 = silent). The post step immediately clears content
          # so the card is embed-only — spoilers and ZWSP still leave a line.
          payload = {
              "username": f"{product} Releases",
              "avatar_url": avatar,
              **({"content": f"<@&{role}>"} if role else {}),
              "allowed_mentions": {"parse": [], **({"roles": [role]} if role else {})},
              "flags": 4096,
              "embeds": [embed],
          }

          # Discord's limits: title 256, description 4096, footer 2048, all of an embed's text 6000, username 80.
          sizes = {k: len(embed[k]) for k in ("title", "description")} | {"footer": len(embed["footer"]["text"])}
          if sizes["title"] > 256 or sizes["description"] > 4096 or sizes["footer"] > 2048 or sum(sizes.values()) > 6000 or len(payload["username"]) > 80:
              sys.exit(f"::error::The card is over Discord's limits: {sizes}.")
          json.dump(payload, open(sys.argv[2], "w", encoding="utf-8"), ensure_ascii=False)
          print(f"Card: {embed['title']}; {min(len(items), 3)} of {len(items)} What's New items; picture {hero or 'none'}; footer {embed['footer']['text']}.")
          PY

      - name: Load previous card id
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          list="$(curl -sS --fail-with-body "${auth[@]}" \
            "$API_URL/repos/$REPO/actions/artifacts?name=$STATE_ARTIFACT&per_page=20")" || {
            echo "::warning::Could not list artifacts; the previous card will not be removed."
            exit 0
          }
          dl="$(jq -r '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .archive_download_url // empty' <<< "$list")"
          if [[ -z "$dl" ]]; then
            echo "No stored previous card id."
            exit 0
          fi
          if ! curl -sSL --fail "${auth[@]}" -o "$RUNNER_TEMP/state.zip" "$dl"; then
            echo "::warning::Could not download $STATE_ARTIFACT; the previous card will not be removed."
            exit 0
          fi
          id="$(unzip -p "$RUNNER_TEMP/state.zip" message-id.txt 2>/dev/null | tr -d '[:space:]' || true)"
          if [[ "$id" =~ ^[0-9]{17,20}$ ]]; then
            echo "Previous card message id: $id"
            echo "message_id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Stored previous card id is invalid; ignoring it."
          fi

      - name: Post new card and remove previous (or print in dry run)
        id: post
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          PREV_ID: ${{ steps.prev.outputs.message_id }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/payload.json"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: not posting. Payload (application/json):"
            jq . "$payload"
            if jq -e '.content != null and .content != ""' "$payload" > /dev/null; then
              echo "Would then PATCH content to empty (hide the role mention after it fires)."
            fi
            echo "Would then delete previous card: ${PREV_ID:-<none stored>}"
            if [[ -z "${WEBHOOK_URL:-}" ]]; then
              echo "::warning::Secret DISCORD_RELEASES_WEBHOOK is not set; a real run would fail."
            fi
            exit 0
          fi
          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "::error::Repository secret DISCORD_RELEASES_WEBHOOK is missing or empty. Add the Discord webhook URL under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Split an optional query string (e.g. thread_id) off the webhook URL.
          base="${WEBHOOK_URL%%\?*}"
          base="${base%/}"
          query=""
          [[ "$WEBHOOK_URL" == *\?* ]] && query="${WEBHOOK_URL#*\?}"
          # URLs are passed via curl config on stdin so they never appear in argv or logs.
          discord() { # method path-suffix query-extra [curl args...]
            local method="$1" suffix="$2" extra="$3"
            shift 3
            local q="$query"
            [[ -n "$extra" ]] && q="${q:+$q&}$extra"
            printf 'url = "%s%s%s"\n' "$base" "$suffix" "${q:+?$q}" | curl -sS -K - -X "$method" \
              -o "$RUNNER_TEMP/discord-response.json" -w '%{http_code}' "$@"
          }
          # Discord fetches avatar_url once, as it posts, and a card it couldn't fetch it for keeps
          # the webhook's default avatar for good (Exo Cinema 1.3.0's did): post that card again.
          for try in 1 2 3; do
            code="$(discord POST "" "wait=true" -H "Content-Type: application/json" --data-binary "@$payload")"
            if [[ "$code" != 2* ]]; then
              echo "::error::Discord webhook returned HTTP $code."
              jq -c '{code, message, errors}' "$RUNNER_TEMP/discord-response.json" 2>/dev/null || true
              exit 1
            fi
            new_id="$(jq -r '.id // empty' "$RUNNER_TEMP/discord-response.json")"
            if [[ ! "$new_id" =~ ^[0-9]{17,20}$ ]]; then
              echo "::error::Discord did not return a message id."
              exit 1
            fi
            [[ -n "$(jq -r '.author.avatar // empty' "$RUNNER_TEMP/discord-response.json")" ]] && break
            if [[ "$try" == 3 ]]; then
              echo "::warning::Discord did not take the avatar in 3 tries; card $new_id shows the webhook's own."
              break
            fi
            echo "Discord did not take the avatar (try $try); posting the card again."
            discord DELETE "/messages/$new_id" "" > /dev/null || true
            sleep 10
          done
          echo "Posted release card (HTTP $code, message id $new_id)."
          echo "message_id=$new_id" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/state"
          printf '%s\n' "$new_id" > "$RUNNER_TEMP/state/message-id.txt"
          # Mention already fired; strip the markup so the card has no content line.
          if jq -e '.content != null and .content != ""' "$payload" > /dev/null; then
            printf '%s\n' '{"content":""}' > "$RUNNER_TEMP/strip.json"
            strip_code="$(discord PATCH "/messages/$new_id" "" -H "Content-Type: application/json" --data-binary "@$RUNNER_TEMP/strip.json")"
            case "$strip_code" in
              2*) echo "Cleared role markup from card $new_id." ;;
              *) echo "::warning::Posted the card but could not hide the role mention (HTTP $strip_code)." ;;
            esac
          fi
          if [[ -n "${PREV_ID:-}" && "$PREV_ID" != "$new_id" ]]; then
            code="$(discord DELETE "/messages/$PREV_ID" "")"
            case "$code" in
              204) echo "Deleted previous card $PREV_ID." ;;
              404) echo "Previous card $PREV_ID was already gone." ;;
              *) echo "::warning::Could not delete previous card $PREV_ID (HTTP $code)." ;;
            esac
          else
            echo "No previous card to delete."
          fi

      - name: Save card id for next run
        if: steps.post.outputs.message_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.STATE_ARTIFACT }}
          path: ${{ runner.temp }}/state/message-id.txt
          retention-days: 90
          if-no-files-found: error
